[project]
name = "wot-strats"
dynamic = ["version"]  # strats/__init__.py
description = "World of Tanks strat reference: type a map name, see that map's slide from each imported StratSketch strat."
requires-python = ">=3.11"
dependencies = ["pywebview>=6"]

[project.optional-dependencies]
release = ["pyinstaller>=6.16"]  # only for building the exe: python tools/release.py

[project.scripts]
wot-strats = "strats.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["strats"]

[tool.setuptools.dynamic]
version = {attr = "strats.__version__"}

[tool.setuptools.package-data]
strats = ["extract.js", "page.template.html", "static/icon*"]
