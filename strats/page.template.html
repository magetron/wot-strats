<meta charset="utf-8">
<title>WoT Strats</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*__FONTS__*/
/* Layout: one-screen tool. Search + strat tabs on top, square map stage left, notes column right; stacks on phones. */
:root {
  --bg: #0c1012;        /* gunmetal ground */
  --panel: #131a1d;
  --panel-2: #1a2327;
  --line: #2a363b;
  --fg: #e4eaec;
  --muted: #8a989e;
  --accent: #e8b84a;    /* brass */
  --accent-ink: #1b1404;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
  --top-h: 76px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.search { position: relative; flex: 0 1 340px; min-width: 0; }
.search input {
  width: 100%; height: 46px; padding: 0 14px 0 40px;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
  font: 600 22px/1 var(--display); letter-spacing: .02em;
}
.search input::placeholder { color: var(--muted); font-weight: 500; }
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.search svg { position: absolute; left: 12px; top: 13px; width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; }
.sugg {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.5);
}
.sugg li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 4px; cursor: pointer; }
.sugg li[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.sugg .nm { font: 600 19px/1.1 var(--display); flex: 1; }
.sugg .has { display: flex; gap: 4px; }
.chip { font: 600 11px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 3px 5px; border-radius: 3px; background: var(--line); color: var(--fg); }
.sugg li[aria-selected="true"] .chip { background: rgba(0,0,0,.18); color: var(--accent-ink); }
.sugg .none { padding: 8px 10px; color: var(--muted); cursor: default; }

.title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.title h1 { margin: 0; font: 700 34px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; text-wrap: balance; }
.title .code { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.tab {
  display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  font: 600 17px/1 var(--display); letter-spacing: .03em; text-transform: uppercase;
}
.tab kbd { font: 600 11px/1 var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab[aria-selected="true"] kbd { color: var(--accent-ink); border-color: rgba(0,0,0,.25); }
.tab:disabled { opacity: .35; cursor: not-allowed; }

/* ---------- main ---------- */
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 27vw, 600px); gap: 18px; min-height: 0;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage-col { display: flex; justify-content: center; align-items: flex-start; min-width: 0; min-height: 0; }
.stage {
  position: relative; width: min(100%, calc(100dvh - var(--top-h) - 30px)); max-width: 100%; aspect-ratio: 1;
  overflow: hidden; container-type: inline-size; border-radius: 6px; background: #000;
  touch-action: none; cursor: grab; user-select: none;
}
.stage.dragging { cursor: grabbing; }
.zoom { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
.zoom img, .zoom svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.zoom img { transition: opacity .12s; }
.zoom img.loading { opacity: .55; }
.zoom svg { overflow: hidden; filter: drop-shadow(0 0 1.2px rgba(0,0,0,.9)); pointer-events: none; }
.notes { position: absolute; inset: 0; pointer-events: none; }
.note {
  position: absolute; text-align: center; line-height: 1.15; font-family: var(--body); font-weight: 600;
  overflow-wrap: anywhere; text-shadow: 0 0 2px #000, 0 0 3px #000, 0 1px 2px #000;
}
.grid-off .gridlayer { display: none; }
.notes-off .notes, .notes-off .notetext { display: none; }

.ctl {
  position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; padding: 4px;
  background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 6px;
}
.ctl button { min-width: 34px; height: 30px; padding: 0 8px; background: transparent; border: 0; border-radius: 4px; cursor: pointer; font: 600 14px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.ctl button:hover { background: var(--line); }
.ctl button[aria-pressed="false"] { color: var(--muted); }
.zlevel { align-self: center; min-width: 38px; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ---------- side column ---------- */
.side { display: flex; flex-direction: column; gap: 18px; overflow: auto; min-height: 0; min-width: 0; padding-right: 2px; font-size: clamp(15px, 0.95vw, 21px); }
.side h2 { margin: 0 0 8px; font: 600 1em/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.meta { margin: 0 0 8px; color: var(--muted); font-size: .9em; }
.meta strong { color: var(--fg); font-weight: 600; }
.slidepick { display: flex; gap: 6px; margin: 0 0 10px; }
.slidepick button { height: 28px; padding: 0 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 13px; }
.slidepick button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: start; }
.sw { width: 10px; height: 10px; margin-top: .45em; border-radius: 2px; }
.sw.line { height: 3px; margin-top: .68em; border-radius: 0; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.notes-box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
.notes-box .list li span { font-size: 1.05em; }
.rules li span { font-size: .95em; color: color-mix(in srgb, var(--fg) 85%, var(--muted)); }
.src a { color: var(--accent); }
.src p { margin: 0; color: var(--muted); font-size: .87em; }
#bStrats { color: var(--muted); }
.dlg { width: min(680px, calc(100vw - 32px)); padding: 18px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
.dlg::backdrop { background: rgba(0,0,0,.55); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.dlg-head h2 { margin: 0; font: 700 24px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.dlg input { height: 38px; padding: 0 10px; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; font: 15px var(--body); }
.dlg input:focus { border-color: var(--accent); outline: none; }
.dlg button { height: 38px; padding: 0 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
.dlg button:hover:not(:disabled) { border-color: var(--muted); }
.dlg button:disabled { opacity: .4; cursor: default; }
.dlg button.ghost { border-color: transparent; background: transparent; }
.dlg button.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font: 600 17px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.dlg button.armed { border-color: #e2574c; color: #ff8a80; }
.stratlist { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.stratlist li { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.stratlist .ttl { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stratlist .acts { display: flex; gap: 4px; }
.stratlist .acts button { min-width: 38px; padding: 0 8px; }
.add { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 8px; }
.status { min-height: 1.4em; margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.status.bad { color: #ff8a80; }
@media (max-width: 560px) { .stratlist li, .add { grid-template-columns: minmax(0, 1fr); } }
details.all summary { cursor: pointer; font: 600 15px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.allmaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px; margin-top: 10px; }
.allmaps button { text-align: left; padding: 6px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font: 600 15px/1.1 var(--display); }
.allmaps button.cur { border-color: var(--accent); color: var(--accent); }
.allmaps button.dim { opacity: .4; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.hint kbd { font: 600 11px/1 var(--body); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; }

@media (max-width: 900px) {
  .app { height: auto; display: block; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .stage { width: 100%; }
  .side { overflow: visible; }
  .tabs { margin-left: 0; }
  .title h1 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { .zoom img { transition: none; } }
</style>

<div class="app">
  <header class="top" id="top">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="text" placeholder="Type a map…" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="sugg" aria-label="Map name">
      <ul class="sugg" id="sugg" role="listbox" hidden></ul>
    </div>
    <div class="title"><h1 id="mapname">—</h1><span class="code" id="mapcode"></span></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Strat"></div>
    <button class="tab" id="bStrats" type="button" hidden>Strats…</button>
  </header>

  <main class="layout">
    <div class="stage-col">
      <div class="stage" id="stage">
        <div class="zoom" id="zoom">
          <img id="mapimg" alt="" draggable="false">
          <svg id="ov" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
          <div class="notes" id="notes"></div>
        </div>
        <div class="ctl">
          <button id="bGrid" aria-pressed="true" title="Show grid">Grid</button>
          <button id="bNotes" aria-pressed="true" title="Show notes on the map">Notes</button>
          <button id="bOut" title="Zoom out (-)">−</button>
          <span class="zlevel" id="zlevel">1×</span>
          <button id="bIn" title="Zoom in (+)">+</button>
          <button id="bFit" title="Reset zoom (0)">Fit</button>
        </div>
      </div>
    </div>

    <aside class="side">
      <section class="notes-box">
        <h2>On this map</h2>
        <p class="meta" id="meta"></p>
        <div class="slidepick" id="slidepick" hidden></div>
        <ul class="list" id="mapnotes"></ul>
      </section>
      <section id="legendSec">
        <h2>Legend</h2>
        <ul class="list" id="legend"></ul>
      </section>
      <section id="generalSec">
        <h2>Strat notes</h2>
        <ul class="list rules" id="general"></ul>
      </section>
      <section class="src" id="src"></section>
      <details class="all">
        <summary>All maps</summary>
        <div class="allmaps" id="allmaps"></div>
      </details>
    </aside>
  </main>
</div>

<dialog class="dlg" id="dlg">
  <div class="dlg-head"><h2>Strats</h2><button type="button" class="ghost" id="dlgClose" aria-label="Close">✕</button></div>
  <ul class="stratlist" id="stratlist"></ul>
  <form class="add" id="addForm">
    <input id="addUrl" type="text" placeholder="Paste a StratSketch link" autocomplete="off" spellcheck="false" aria-label="StratSketch link">
    <input id="addLabel" type="text" placeholder="Name" maxlength="28" autocomplete="off" aria-label="Name for the tab">
    <button type="submit" class="go" id="addBtn">Add</button>
  </form>
  <p class="status" id="dlgStatus" role="status"></p>
</dialog>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- search ---------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/'/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const INDEX = D.order.map(code => {
  const m = D.maps[code];
  return { code, terms: [m.name, ...m.alias, code.replace(/^\d+_/, '').replace(/_/g, ' ')].map(norm) };
});
function subseq(a, b) { let i = 0; for (const ch of b) { if (ch === a[i]) i++; if (i === a.length) return true; } return a.length === 0; }
function scoreTerm(t, q, qc) {
  if (t === q) return 100;
  if (t.startsWith(q)) return 90;
  if (t.replace(/ /g, '').startsWith(qc)) return 85;
  if (t.split(' ').some(w => w.startsWith(q))) return 75;
  if (t.includes(q)) return 55;
  if (qc.length >= 3 && subseq(qc, t.replace(/ /g, ''))) return 25;
  return 0;
}
function search(raw) {
  const q = norm(raw); if (!q) return [];
  const qc = q.replace(/ /g, '');
  return INDEX.map(e => ({ code: e.code, s: Math.max(...e.terms.map(t => scoreTerm(t, q, qc))) }))
    .filter(r => r.s > 0)
    .sort((a, b) => b.s - a.s || D.maps[a.code].name.localeCompare(D.maps[b.code].name))
    .slice(0, 7).map(r => r.code);
}

/* ---------- state ---------- */
const S = { code: null, strat: store.get('strat') || (D.strats[0] || {}).key, slide: 0, grid: store.get('grid') !== '0', notes: store.get('notes') !== '0' };
const stratBy = k => D.strats.find(s => s.key === k);
const slidesFor = (code, strat) => strat.slides.filter(s => s.m === code);
const shortLabel = s => s.label.split(/[\s/]+/)[0].slice(0, 7);

/* ---------- drawing ---------- */
const IC = Object.fromEntries(D.icons.map(i => [i.id, i]));
function shade(hex, k) {
  const n = parseInt(hex.slice(1, 7), 16);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v * k).toString(16).padStart(2, '0')).join('');
}
const ROWS = 'ABCDEFGHJK';
function gridSVG() {
  let s = '<g class="gridlayer" stroke="rgba(255,255,255,.28)" stroke-width="1">';
  for (let i = 1; i < 10; i++) s += `<line x1="${i * 100}" y1="0" x2="${i * 100}" y2="1000"/><line x1="0" y1="${i * 100}" x2="1000" y2="${i * 100}"/>`;
  s += '</g><g class="gridlayer" font-family="Barlow Condensed, sans-serif" font-weight="600" font-size="22" fill="rgba(255,255,255,.85)" stroke="rgba(0,0,0,.75)" stroke-width="3" paint-order="stroke">';
  for (let i = 0; i < 10; i++) {
    s += `<text x="6" y="${i * 100 + (i ? 22 : 44)}">${ROWS[i]}</text>`;
    s += `<text x="${i * 100 + 50}" y="22" text-anchor="middle">${(i + 1) % 10}</text>`;
  }
  return s + '</g>';
}
function styleAttrs(sh, closed) {
  let a = ` stroke="${sh.c || 'none'}" fill="${closed && sh.f ? sh.f : 'none'}"`;
  // drawn 1.5x StratSketch's width so thin routes stay readable at screen size
  if (sh.w) a += ` stroke-width="${sh.w * 1.5}"`;
  if (sh.d) a += ` stroke-dasharray="${sh.d.map(v => v * 1.5).join(' ')}"`;
  if (sh.op) a += ` opacity="${sh.op}"`;
  return a + ' stroke-linecap="round" stroke-linejoin="round"';
}
function shapeSVG(sh) {
  if (sh.p) {
    const pts = []; for (let i = 0; i < sh.p.length; i += 2) pts.push(sh.p[i] + ',' + sh.p[i + 1]);
    return `<${sh.z ? 'polygon' : 'polyline'} points="${pts.join(' ')}"${styleAttrs(sh, !!sh.z)}/>`;
  }
  if (Array.isArray(sh.o)) return `<circle cx="${sh.o[0]}" cy="${sh.o[1]}" r="${sh.o[2]}"${styleAttrs(sh, true)}/>`;
  if (sh.r) return `<rect x="${sh.r[0]}" y="${sh.r[1]}" width="${sh.r[2]}" height="${sh.r[3]}" rx="${sh.r[4] || 0}"${styleAttrs(sh, true)}/>`;
  if (sh.a) { const [sx, sy, ex, ey, r, large, sweep] = sh.a; return `<path d="M${sx} ${sy}A${r} ${r} 0 ${large} ${sweep} ${ex} ${ey}"${styleAttrs(sh, false)}/>`; }
  return '';
}
function iconSVG(it, grads) {
  const [x, y, c, id] = it; const label = typeof it[4] === 'string' ? it[4] : '';
  const ic = IC[id] || IC[0]; const k = ic.scale * 1000 / ic.h;
  const gid = 'g' + c.slice(1) + '_' + ic.h;
  if (!grads.has(gid)) grads.set(gid, `<linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="0" y1="${ic.h / 3}" x2="0" y2="${ic.h}"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${shade(c, .65)}"/></linearGradient>`);
  let s = `<g transform="translate(${(x - ic.w * k / 2).toFixed(2)} ${(y - ic.h * k / 2).toFixed(2)}) scale(${k.toFixed(4)})"><path d="${ic.path}" fill="url(#${gid})" stroke="#000" stroke-width="${(1 / k).toFixed(3)}"/></g>`;
  if (label) s += `<text x="${x + 8.6}" y="${y - 16}" font-size="16" fill="#fff" dominant-baseline="middle">${esc(label)}</text>`;
  return s;
}
const offMap = t => t[0] < 0 || t[0] + t[2] > 1000 || t[1] < 0 || t[1] > 1000;
function sideOf(map, slide) {
  const flags = (map.bases[slide.v] || []).filter(b => b[3] === 'flag');
  const f = flags.find(b => b[2] === slide.team), e = flags.find(b => b[2] !== slide.team);
  if (!f || !e) return '';
  const dx = f[0] - e[0], dy = f[1] - e[1];
  return Math.abs(dy) >= Math.abs(dx) ? (dy > 0 ? 'south' : 'north') : (dx > 0 ? 'east' : 'west');
}

/* ---------- render ---------- */
let loadToken = 0;
function show(code, opts = {}) {
  if (!D.maps[code]) return;
  const changedMap = code !== S.code;
  S.code = code;
  const map = D.maps[code];
  // pick strat: keep preference if it covers this map
  let strat = stratBy(S.strat);
  if (!strat || !slidesFor(code, strat).length) strat = D.strats.find(s => slidesFor(code, s).length) || D.strats[0];
  if (opts.strat && slidesFor(code, stratBy(opts.strat)).length) strat = stratBy(opts.strat);
  S.shown = strat.key;
  const slides = slidesFor(code, strat);
  if (changedMap || opts.strat) S.slide = 0;
  if (opts.slide !== undefined) S.slide = opts.slide;
  const slide = slides[Math.min(S.slide, slides.length - 1)];

  $('#mapname').textContent = map.name;
  $('#mapcode').textContent = code;
  document.title = 'WoT Strats';
  renderTabs(code, strat.key);

  // image first, overlay swapped together with it
  const token = ++loadToken;
  const img = $('#mapimg');
  const url = 'maps/' + code + '.webp';
  const apply = () => { if (token !== loadToken) return; if (!img.src.endsWith(url)) img.src = url; img.classList.remove('loading'); drawSlide(map, slide); };
  if (img.src.endsWith(url)) apply();
  else {
    img.classList.add('loading');
    const pre = new Image(); pre.src = url;
    (pre.decode ? pre.decode() : Promise.resolve()).then(apply, apply);
  }
  if (changedMap) resetZoom();

  // side column
  const n = strat.total;
  const side = sideOf(map, slide);
  $('#meta').innerHTML = `<strong>${esc(strat.label)}</strong> · slide ${slide.n} of ${n}${slide.nm ? ' (“' + esc(slide.nm) + '”)' : ''}` +
    (side ? `<br>Green flag = ${side} base` : '');
  const pick = $('#slidepick');
  pick.hidden = slides.length < 2;
  pick.innerHTML = slides.map((s, i) => `<button type="button" data-i="${i}" aria-pressed="${s === slide}">Slide ${s.n}${sideOf(map, s) ? ' · ' + sideOf(map, s) : ''}</button>`).join('');
  const notes = slide.t;
  $('#mapnotes').hidden = !notes.length;
  $('#mapnotes').innerHTML = notes.map(t => `<li><i class="sw" style="background:${t[4]}"></i><span>${esc(t[5])}</span></li>`).join('');
  $('#legendSec').hidden = !strat.legend.length;
  $('#legend').innerHTML = strat.legend.map(([c, t]) => `<li><i class="sw line" style="background:${c}"></i><span>${esc(t)}</span></li>`).join('');
  const gen = [...strat.rules, ...strat.general];
  $('#generalSec').hidden = !gen.length;
  $('#general').innerHTML = gen.map(([c, t]) => `<li><i class="sw" style="background:${c}"></i><span>${esc(t)}</span></li>`).join('');
  $('#src').innerHTML = `<p>${esc(strat.title)}</p><a href="${strat.url}" target="_blank" rel="noopener">Open this strat in StratSketch ↗</a>`;
  document.querySelectorAll('#allmaps button').forEach(b => {
    b.classList.toggle('cur', b.dataset.code === code);
    b.classList.toggle('dim', !slidesFor(b.dataset.code, strat).length);
  });
  try { if (location.hash.slice(1) !== map.slug) history.replaceState(null, '', '#' + map.slug); } catch {}
  store.set('last', code);
}
function drawSlide(map, slide) {
  const grads = new Map();
  let body = gridSVG();
  for (const [x, y, team, icon] of map.bases[slide.v] || []) {
    const r = icon === 'flag' ? 35 : 28;
    body += `<image href="maps/${icon}_${team === slide.team ? 'friendly' : 'enemy'}.webp" x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}"/>`;
  }
  for (const sh of slide.s) body += shapeSVG(sh);
  for (const it of slide.i) body += iconSVG(it, grads);
  $('#ov').innerHTML = `<defs>${[...grads.values()].join('')}</defs>` + body;
  $('#notes').innerHTML = slide.t.filter(t => !offMap(t)).map(t =>
    `<div class="note" style="left:${t[0] / 10}%;top:${t[1] / 10}%;width:${t[2] / 10}%;font-size:${(t[3] * 0.25).toFixed(2)}cqw;color:${t[4]}">${esc(t[5])}</div>`).join('');
}
function renderTabs(code, active) {
  $('#tabs').innerHTML = D.strats.map((s, i) => {
    const n = slidesFor(code, s).length;
    return `<button class="tab" role="tab" data-k="${s.key}" aria-selected="${s.key === active}" ${n ? '' : 'disabled title="No slide for this map"'}><kbd>${i + 1}</kbd>${esc(s.label)}</button>`;
  }).join('');
}
function chooseStrat(key) {
  const s = stratBy(key); if (!s || !S.code || !slidesFor(S.code, s).length) return;
  S.strat = key; store.set('strat', key); show(S.code, { strat: key });
}

/* ---------- search box ---------- */
const q = $('#q'), sugg = $('#sugg');
let results = [], hi = 0;
function renderSugg() {
  q.setAttribute('aria-expanded', String(!sugg.hidden));
  if (!q.value.trim()) { sugg.hidden = true; q.setAttribute('aria-expanded', 'false'); return; }
  sugg.hidden = false; q.setAttribute('aria-expanded', 'true');
  if (!results.length) { sugg.innerHTML = '<li class="none">No map with a strat matches that</li>'; return; }
  sugg.innerHTML = results.map((c, i) => {
    const has = D.strats.filter(s => slidesFor(c, s).length).map(s => `<span class="chip">${esc(shortLabel(s))}</span>`).join('');
    return `<li role="option" data-code="${c}" aria-selected="${i === hi}"><span class="nm">${esc(D.maps[c].name)}</span><span class="has">${has}</span></li>`;
  }).join('');
}
function onInput() {
  results = search(q.value); hi = 0; renderSugg();
  if (results.length) show(results[0]);
}
function commit(code) {
  if (code) show(code);
  sugg.hidden = true; q.setAttribute('aria-expanded', 'false');
  q.value = S.code ? D.maps[S.code].name : ''; q.select();
}
q.addEventListener('input', onInput);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!results.length) return; e.preventDefault();
    hi = (hi + (e.key === 'ArrowDown' ? 1 : results.length - 1)) % results.length;
    renderSugg(); show(results[hi]);
  } else if (e.key === 'Enter') { e.preventDefault(); commit(results[hi]); }
  else if (e.key === 'Escape') { if (!sugg.hidden) { sugg.hidden = true; q.value = ''; } else q.blur(); }
});
q.addEventListener('focus', () => q.select());
q.addEventListener('blur', () => setTimeout(() => { sugg.hidden = true; q.setAttribute('aria-expanded', 'false'); }, 150));
sugg.addEventListener('mousedown', e => { const li = e.target.closest('li[data-code]'); if (li) { e.preventDefault(); commit(li.dataset.code); } });

$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b && !b.disabled) chooseStrat(b.dataset.k); });
$('#slidepick').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(S.code, { slide: +b.dataset.i }); });
$('#allmaps').innerHTML = D.order.map(c => `<button type="button" data-code="${c}">${esc(D.maps[c].name)}</button>`).join('');
$('#allmaps').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { show(b.dataset.code); q.value = D.maps[b.dataset.code].name; } });

/* typing anywhere jumps into the search box */
document.addEventListener('keydown', e => {
  if (e.target.closest('input, dialog') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[a-z]$/i.test(e.key)) { e.preventDefault(); q.focus(); q.value = e.key; onInput(); }
  else if (/^[1-9]$/.test(e.key) && D.strats[+e.key - 1]) chooseStrat(D.strats[+e.key - 1].key);
  else if (e.key === '+' || e.key === '=') zoomBy(1.4);
  else if (e.key === '-' || e.key === '_') zoomBy(1 / 1.4);
  else if (e.key === '0') resetZoom();
});

/* ---------- toggles ---------- */
const stage = $('#stage');
function applyToggles() {
  stage.classList.toggle('grid-off', !S.grid); stage.classList.toggle('notes-off', !S.notes);
  $('#bGrid').setAttribute('aria-pressed', S.grid); $('#bNotes').setAttribute('aria-pressed', S.notes);
}
$('#bGrid').onclick = () => { S.grid = !S.grid; store.set('grid', S.grid ? '1' : '0'); applyToggles(); };
$('#bNotes').onclick = () => { S.notes = !S.notes; store.set('notes', S.notes ? '1' : '0'); applyToggles(); };
applyToggles();

/* ---------- zoom & pan ---------- */
const zoomEl = $('#zoom');
const Z = { s: 1, x: 0, y: 0 };
function clampZ() {
  const W = stage.clientWidth;
  Z.s = Math.min(8, Math.max(1, Z.s));
  Z.x = Math.min(0, Math.max(W - W * Z.s, Z.x));
  Z.y = Math.min(0, Math.max(W - W * Z.s, Z.y));
  zoomEl.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`;
  $('#zlevel').textContent = (Math.round(Z.s * 10) / 10) + '×';
}
function zoomAt(px, py, f) { const ns = Math.min(8, Math.max(1, Z.s * f)); Z.x = px - (px - Z.x) * ns / Z.s; Z.y = py - (py - Z.y) * ns / Z.s; Z.s = ns; clampZ(); }
function zoomBy(f) { const W = stage.clientWidth; zoomAt(W / 2, W / 2, f); }
function resetZoom() { Z.s = 1; Z.x = 0; Z.y = 0; clampZ(); }
$('#bIn').onclick = () => zoomBy(1.4); $('#bOut').onclick = () => zoomBy(1 / 1.4); $('#bFit').onclick = resetZoom;
stage.addEventListener('wheel', e => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });
const ptrs = new Map(); let pinch = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.ctl')) return;
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); const r = stage.getBoundingClientRect();
    zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch.d); pinch.d = d;
  } else if (ptrs.size === 1) { Z.x += e.clientX - prev.x; Z.y += e.clientY - prev.y; clampZ(); }
});
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) stage.classList.remove('dragging'); };
stage.addEventListener('pointerup', endPtr); stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('dblclick', e => {
  if (e.target.closest('.ctl')) return;
  const r = stage.getBoundingClientRect();
  if (Z.s > 1.05) resetZoom(); else zoomAt(e.clientX - r.left, e.clientY - r.top, 2.5);
});

/* keep the square map inside the window height */
const topBar = $('#top');
new ResizeObserver(() => { document.documentElement.style.setProperty('--top-h', topBar.offsetHeight + 'px'); clampZ(); }).observe(topBar);
new ResizeObserver(() => clampZ()).observe(stage);

/* ---------- start ---------- */
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  return D.order.find(c => D.maps[c].slug === h);
}
window.addEventListener('hashchange', () => { const c = fromHash(); if (c && c !== S.code) show(c); });
if (D.order.length) {
  const startCode = fromHash() || (D.maps[store.get('last')] ? store.get('last') : D.order[0]);
  show(startCode);
  q.value = D.maps[startCode].name;
  q.focus(); q.select();
} else {
  $('#mapname').textContent = 'No strats yet';
}

/* ---------- managing strats (only in the app window, which provides pywebview.api) ---------- */
const dlg = $('#dlg'), statusEl = $('#dlgStatus');
const say = (text, bad) => { statusEl.textContent = text || ''; statusEl.classList.toggle('bad', !!bad); };
function renderStratList() {
  $('#stratlist').innerHTML = D.strats.map((s, i) => `<li data-k="${esc(s.key)}">
    <input class="lbl" value="${esc(s.label)}" maxlength="28" aria-label="Name">
    <span class="ttl" title="${esc(s.title)}">${esc(s.title)} · ${s.total} slides</span>
    <span class="acts"><button type="button" data-act="up" title="Move left" ${i ? '' : 'disabled'}>↑</button><button type="button" data-act="down" title="Move right" ${i < D.strats.length - 1 ? '' : 'disabled'}>↓</button><button type="button" data-act="refresh" title="Import again from StratSketch">↻</button><button type="button" data-act="remove" title="Remove">✕</button></span></li>`).join('');
}
async function call(text, fn, done) {
  dlg.querySelectorAll('button, input').forEach(el => { if (el.id !== 'dlgClose') el.disabled = true; });
  say(text);
  let r;
  try { r = await fn(window.pywebview.api); } catch (e) { r = { ok: false, error: String(e) }; }
  if (r && r.ok) {
    try { sessionStorage.setItem('dlgmsg', done ? done(r) : ' '); } catch {}
    location.reload();
  } else {
    dlg.querySelectorAll('button, input').forEach(el => { el.disabled = false; });
    renderStratList(); say((r && r.error) || 'That didn\'t work.', true);
  }
}
$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const link = $('#addUrl').value.trim(); if (!link) return;
  const label = $('#addLabel').value.trim();
  call('Importing from StratSketch…', api => api.add(link, label), r => `Added ${r.label}: ${r.slides} slides.` +
    (r.skipped ? ` ${r.skipped} slides aren't on a WoT map and were left out.` : '') +
    (r.missing_maps && r.missing_maps.length ? ` Couldn't download the map image for: ${r.missing_maps.join(', ')}.` : ''));
});
$('#stratlist').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const key = b.closest('li').dataset.k, act = b.dataset.act;
  if (act === 'refresh') call('Importing from StratSketch…', api => api.refresh(key), r => `Refreshed ${r.label}: ${r.slides} slides.`);
  else if (act === 'up' || act === 'down') call('', api => api.move(key, act === 'up' ? -1 : 1));
  else if (act === 'remove') {
    if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Remove?'; return; }
    call('', api => api.remove(key), () => 'Removed.');
  }
});
$('#stratlist').addEventListener('change', e => {
  if (!e.target.classList.contains('lbl')) return;
  const key = e.target.closest('li').dataset.k, label = e.target.value.trim();
  if (label) call('', api => api.rename(key, label));
});
$('#dlgClose').onclick = () => dlg.close();
$('#bStrats').onclick = () => { renderStratList(); say(''); dlg.showModal(); $('#addUrl').focus(); };
let manageReady = false;
function initManage() {
  if (manageReady || !(window.pywebview && window.pywebview.api)) return;
  manageReady = true;
  $('#bStrats').hidden = false;
  let msg = null; try { msg = sessionStorage.getItem('dlgmsg'); sessionStorage.removeItem('dlgmsg'); } catch {}
  if (msg !== null || !D.strats.length) { renderStratList(); dlg.showModal(); say((msg || '').trim()); }
}
window.addEventListener('pywebviewready', initManage);
initManage();
</script>
